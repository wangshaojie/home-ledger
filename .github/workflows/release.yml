name: Release Windows Installer

# 触发条件：推送形如 v1.0.1 的 tag
on:
  push:
    tags:
      - '*'

permissions:
  contents: write  # 写 release 必须

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm via corepack
        # 使用 Node 自带 corepack 启用 pnpm，避免 pnpm/action-setup 在新版 Node 上
        # PATH 注入失败导致 "Unable to locate executable file: pnpm" 的问题。
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Build renderer (Vite)
        run: pnpm exec vite build
        # v1.1 起强制线上模式：必须注入 Supabase env。GitHub repo Settings → Secrets
        # 需要配 VITE_SUPABASE_URL 和 VITE_SUPABASE_PUBLISHABLE_KEY（旧版 Supabase
        # 兼容 VITE_SUPABASE_ANON_KEY，二选一即可）。CI 优先用 publishable，回退 anon。
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build main process (electron)
        # 项目没有独立的 vite.config.electron.ts，主进程由 vite.config.ts + vite-plugin-electron
        # 在 'Build renderer' 阶段一起处理。此处仅做类型检查（主进程 src 在 electron/）。
        run: pnpm exec tsc -p tsconfig.electron.json

      - name: Package with electron-builder (NSIS)
        # 先打 NSIS --publish always 上传 asset + latest.yml
        # portable 分两次调是为避免 CI 上 portable/NSIS 同时跑 artifactName 撞车
        run: pnpm exec electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package with electron-builder (Portable)
        # portable 段 artifactName 固定 "home-ledger-${version}-portable-${arch}.${ext}"
        # 不用 ${productName} 避免 productName 映射 (家庭记账 -> home-ledger) 误替换
        # CI 跑两次（两次 electron-builder）能看各自日志, portable publish 阶段
        # 默认走 GitHub provider 自动上传到 release
        run: pnpm exec electron-builder --win portable --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: home-ledger-windows-${{ github.ref_name }}
          path: |
            release/**/*.exe
            release/**/*.yml
            release/**/*.blockmap
