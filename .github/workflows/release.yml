name: Release Windows Installer

# 触发条件：推送形如 v1.0.1 的 tag
on:
  push:
    tags:
      - '*'

permissions:
  contents: write  # 写 release 必须

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm via corepack
        # 使用 Node 自带 corepack 启用 pnpm，避免 pnpm/action-setup 在新版 Node 上
        # PATH 注入失败导致 "Unable to locate executable file: pnpm" 的问题。
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Build renderer (Vite)
        run: pnpm exec vite build
        # v1.1 起强制线上模式：必须注入 Supabase env。GitHub repo Settings → Secrets
        # 需要配 VITE_SUPABASE_URL 和 VITE_SUPABASE_PUBLISHABLE_KEY（旧版 Supabase
        # 兼容 VITE_SUPABASE_ANON_KEY，二选一即可）。CI 优先用 publishable，回退 anon。
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build main process (electron)
        # 项目没有独立的 vite.config.electron.ts，主进程由 vite.config.ts + vite-plugin-electron
        # 在 'Build renderer' 阶段一起处理。此处仅做类型检查（主进程 src 在 electron/）。
        run: pnpm exec tsc -p tsconfig.electron.json

      - name: Package with electron-builder (NSIS + Portable)
        run: pnpm exec electron-builder --win nsis portable --x64 --publish always
        env:
          # electron-updater 需要 GH_TOKEN 才能 publish release
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: home-ledger-windows-${{ github.ref_name }}
          path: |
            release/**/*.exe
            release/**/*.yml
            release/**/*.blockmap
