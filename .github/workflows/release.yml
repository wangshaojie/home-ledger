name: Release Windows Installer

# 触发条件：推送形如 v1.0.1 的 tag
on:
  push:
    tags:
      - '*'

permissions:
  contents: write  # 写 release 必须

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm via corepack
        # 使用 Node 自带 corepack 启用 pnpm，避免 pnpm/action-setup 在新版 Node 上
        # PATH 注入失败导致 "Unable to locate executable file: pnpm" 的问题。
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Build renderer (Vite)
        run: pnpm exec vite build
        # 默认构建走"原型模式"：不注入 VITE_SUPABASE_*，安装包首次启动走
        # 前端 mock 数据（README 第一次使用小节）。如需发布连 Supabase 的版本，
        # 在 repo Settings → Secrets 里加 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY，
        # 然后解开下方 env 块即可。
        # env:
        #   VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        #   VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build main process (electron)
        run: pnpm exec vite build --config vite.config.electron.ts || pnpm exec tsc -p tsconfig.electron.json

      - name: Package with electron-builder (NSIS + Portable)
        run: pnpm exec electron-builder --win nsis portable --x64 --publish always
        env:
          # electron-updater 需要 GH_TOKEN 才能 publish release
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: home-ledger-windows-${{ github.ref_name }}
          path: |
            release/**/*.exe
            release/**/*.yml
            release/**/*.blockmap
